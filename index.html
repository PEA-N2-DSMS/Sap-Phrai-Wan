<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEA WGT03VR-105</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css?v=active-green-pin">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="data.js?v=survey-copy"></script>
<script defer src="wgt03vr-04.js?v=100-records"></script>
<script defer src="app.js?v=all-work-times"></script>
</head>
<body>
<header>
 <div class="header-brand">
  <h1 class="site-title">
   <img class="pea-wordmark" src="pea-logo.png" width="856" height="309" alt="PEA การไฟฟ้าส่วนภูมิภาค">
  </h1>
 </div>
 <div class="circuit-picker">
  <select id="circuit" aria-label="วงจร">
   <option value="WGT03VR-105">WGT03VR-105</option>
   <option value="WGT03VR-04">WGT03VR-04</option>
  </select>
 </div>
 <button id="fit">หน้าแรก</button>
</header>
<dl class="work-summary" aria-label="สรุปงานจากแบบฟอร์มสำรวจ">
 <div><dt id="job-label">จำนวนงาน</dt><dd id="job-total"></dd></div>
 <div><dt id="time-label">ประมาณเวลาในการทำงานรวม</dt><dd id="time-total"></dd></div>
 <div class="manual-jobs"><dt id="manual-label">จุดที่รถเข้าไม่ถึง</dt><dd><button id="manual-total" type="button" aria-pressed="false"></button><button id="browse-survey" type="button" hidden>ดูรายการ</button></dd></div>
</dl>
<main id="dashboard" class="map-overview">
 <section id="map" aria-label="แผนที่ภาพดาวเทียม"><p id="map-status" role="status">กำลังโหลดแผนที่ภาพดาวเทียม</p></section>
 <aside aria-label="ภาพถ่ายและรายละเอียดการสำรวจ">
  <section id="detail" aria-label="รายละเอียดภาพสำรวจ">
   <nav id="photo-navigation" aria-label="เปลี่ยนรูปสำรวจ" hidden>
    <button id="previous-photo" type="button">← ก่อนหน้า</button>
    <span id="photo-position" aria-live="polite"></span>
    <button id="next-photo" type="button">ถัดไป →</button>
   </nav>
   <div id="detail-body"></div>
  </section>
 </aside>
</main>
<footer class="energy-footer" lang="en">
 <div class="energy-caption">
  <strong>SMART ENERGY</strong>
  <span>FOR BETTER LIFE AND SUSTAINABILITY</span>
 </div>
 <div class="energy-gold" aria-hidden="true"></div>
</footer>
</body>
</html>
